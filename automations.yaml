- id: garden_rain_skip
  alias: Garden - Skip Watering on Rain
  description: Prevents garden watering if it has rained or rain is forecast
  triggers:
  - trigger: state
    entity_id:
    - switch.front_drippers2
    - switch.shellyplus1_441793a9ff58_switch_0
    - switch.shellyplus1_083af2028abc_switch_0
    - switch.back_drippers2
    to: 'on'
  conditions:
  - condition: state
    entity_id: binary_sensor.garden_watering_skip
    state: 'on'
  actions:
  - delay:
      seconds: 2
  - action: switch.turn_off
    target:
      entity_id: '{{ trigger.entity_id }}'
  - action: persistent_notification.create
    data:
      title: Garden Watering Skipped
      message: '{{ trigger.to_state.attributes.friendly_name }} was turned off. Reason:
        {{ state_attr(''binary_sensor.garden_watering_skip'', ''reason'') }}'
- id: myair_morning_day_mode
  alias: 'MyAir - Morning: Day Profile'
  description: Activate day profile at 06:30 (upstairs 21°C, downstairs 22°C)
  triggers:
  - trigger: time
    at: 06:30:00
  conditions:
  - condition: state
    entity_id: input_boolean.hvac_schedule_enabled
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.ac
      state: 'off'
  actions:
  - action: script.myair_day_profile
  mode: single
- id: myair_afternoon_maintain
  alias: 'MyAir - Afternoon: Reapply Day Profile'
  description: Reapply day profile at 14:00 to correct any drift
  triggers:
  - trigger: time
    at: '14:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.hvac_schedule_enabled
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.ac
      state: 'off'
  actions:
  - action: script.myair_day_profile
  mode: single
- id: myair_night_mode
  alias: 'MyAir - Night: Sleep Profile'
  description: Activate night profile at 21:00 (upstairs 19°C, downstairs 20°C)
  triggers:
  - trigger: time
    at: '21:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.hvac_schedule_enabled
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.ac
      state: 'off'
  actions:
  - action: script.myair_night_profile
  mode: single
- id: myair_prevent_upstairs_overheat
  alias: MyAir - Prevent Upstairs Overheating
  description: Turn off upstairs zones when they exceed 24°C to prevent overheating
    while downstairs heats
  triggers:
  - trigger: numeric_state
    entity_id:
    - climate.ac_master_ens
    - climate.ac_sasha
    - climate.ac_elise
    - climate.ac_hugo
    - climate.ac_rumpus
    attribute: current_temperature
    above: 24
    for:
      minutes: 5
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.ac
      state: 'off'
  - condition: template
    value_template: "{% set all_zones = [\n  'climate.ac_master_ens',\n  'climate.ac_sasha',\n
      \ 'climate.ac_elise',\n  'climate.ac_hugo',\n  'climate.ac_rumpus',\n  'climate.ac_study',\n
      \ 'climate.ac_cinema',\n  'climate.ac_down_living'\n] %} {% set open_zones =
      all_zones | reject('is_state', 'off') | list | count %} {{ open_zones > 3 }}"
  actions:
  - action: climate.turn_off
    target:
      entity_id: '{{ trigger.entity_id }}'
  - action: persistent_notification.create
    data:
      title: MyAir Zone Temporarily Closed
      message: '{{ trigger.to_state.attributes.friendly_name }} turned off — reached
        {{ trigger.to_state.attributes.current_temperature }}°C (will reopen when
        cool).'
  mode: queued
  max: 5
- id: myair_minimum_zones_warning
  alias: MyAir - Minimum Zones Warning
  description: Alert if only 3 zones remain open (system safety threshold)
  triggers:
  - trigger: template
    value_template: "{% set all_zones = [\n  'climate.ac_master_ens',\n  'climate.ac_sasha',\n
      \ 'climate.ac_elise',\n  'climate.ac_hugo',\n  'climate.ac_rumpus',\n  'climate.ac_study',\n
      \ 'climate.ac_cinema',\n  'climate.ac_down_living'\n] %} {% set open_zones =
      all_zones | reject('is_state', 'off') | list | count %} {{ open_zones == 3 }}"
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.ac
      state: 'off'
  actions:
  - action: persistent_notification.create
    data:
      title: ⚠️ MyAir Minimum Zones Alert
      message: "Only 3 zones remain open. System will not close any more zones to
        protect HVAC. Open zones: {% set all_zones = [\n  'climate.ac_master_ens',\n
        \ 'climate.ac_sasha',\n  'climate.ac_elise',\n  'climate.ac_hugo',\n  'climate.ac_rumpus',\n
        \ 'climate.ac_study',\n  'climate.ac_cinema',\n  'climate.ac_down_living'\n]
        %} {% for zone in all_zones if not is_state(zone, 'off') %} - {{ state_attr(zone,
        'friendly_name') }} {% endfor %}"
  mode: single
- id: myair_reopen_upstairs_zones
  alias: MyAir - Reopen Cooled Upstairs Zones
  description: Turn upstairs zones back on when they cool to 20°C
  triggers:
  - trigger: numeric_state
    entity_id:
    - climate.ac_master_ens
    - climate.ac_sasha
    - climate.ac_elise
    - climate.ac_hugo
    - climate.ac_rumpus
    attribute: current_temperature
    below: 20
    for:
      minutes: 5
  conditions:
  - condition: template
    value_template: '{{ is_state(trigger.entity_id, ''off'') }}'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.ac
      state: 'off'
  - condition: time
    after: 06:30:00
    before: '21:00:00'
  actions:
  - action: climate.turn_on
    target:
      entity_id: '{{ trigger.entity_id }}'
  - action: climate.set_temperature
    target:
      entity_id: '{{ trigger.entity_id }}'
    data:
      temperature: 21
      hvac_mode: heat_cool
  mode: queued
  max: 5
- id: '1785296563629'
  alias: Court Area - Motion After Dark
  description: Turns on light when motion is detected and illuminance is below 50
    lux.
  triggers:
  - entity_id: binary_sensor.courtyardshellymotion2_motion
    to: 'on'
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.courtyardshellymotion2_illuminance
    below: 50
  actions:
  - action: switch.turn_on
    target:
      entity_id:
      - switch.shellyswitch25_c8c9a375b1d4_channel_1
      - switch.courtyard_lights_2
  - wait_for_trigger:
    - entity_id: binary_sensor.courtyardshellymotion2_motion
      to: 'off'
      for:
        minutes: 2
      trigger: state
  - action: switch.turn_off
    target:
      entity_id:
      - switch.shellyswitch25_c8c9a375b1d4_channel_1
      - switch.courtyard_lights_2
  mode: single
