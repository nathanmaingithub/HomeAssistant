myair_day_profile:
  alias: "MyAir - Day Profile"
  icon: mdi:white-balance-sunny
  sequence:
    - variables:
        offset: "{{ states('input_number.hvac_temp_offset') | float(0) }}"
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.ac
      data:
        hvac_mode: heat_cool
    - action: climate.set_temperature
      target:
        entity_id: climate.ac
      data:
        target_temp_low: "{{ 21 + offset }}"
        target_temp_high: "{{ 23 + offset }}"
    - action: select.select_option
      target:
        entity_id: select.ac_myzone
      data:
        option: "Down Living"
    - action: climate.turn_on
      target:
        entity_id:
          - climate.ac_master_ens
          - climate.ac_sasha
          - climate.ac_elise
          - climate.ac_hugo
          - climate.ac_rumpus
          - climate.ac_down_living
          - climate.ac_study
          - climate.ac_cinema
    - action: climate.set_temperature
      target:
        entity_id:
          - climate.ac_master_ens
          - climate.ac_sasha
          - climate.ac_elise
          - climate.ac_hugo
          - climate.ac_rumpus
      data:
        temperature: "{{ 21 + offset }}"
    - action: climate.set_temperature
      target:
        entity_id:
          - climate.ac_down_living
          - climate.ac_study
          - climate.ac_cinema
      data:
        temperature: "{{ 22 + offset }}"

