views:
  - title: Climate
    path: climate
    icon: mdi:thermostat
    cards:
      - type: entities
        title: HVAC Controls
        entities:
          - entity: input_boolean.hvac_schedule_enabled
            name: Schedule Enabled
          - entity: input_number.hvac_temp_offset
            name: Temperature Offset

      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            name: Day Mode
            icon: mdi:white-balance-sunny
            tap_action:
              action: perform-action
              perform_action: script.myair_day_profile
            icon_height: 40px
          - type: button
            name: Night Mode
            icon: mdi:weather-night
            tap_action:
              action: perform-action
              perform_action: script.myair_night_profile
            icon_height: 40px

      - type: thermostat
        entity: climate.ac
        name: Main Unit

      - type: custom:mushroom-template-card
        primary: Outside
        secondary: >-
          {{ states('sensor.shellymotion2_8cf681a1fcec_temperature') }}°C
        icon: mdi:home-thermometer-outline
        tap_action:
          action: more-info
        entity: sensor.shellymotion2_8cf681a1fcec_temperature

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Hugo
            secondary: >-
              {{ state_attr('climate.ac_hugo', 'current_temperature') }}°C
              (target {{ state_attr('climate.ac_hugo', 'temperature') }}°C) ·
              Vent {{ states('sensor.ac_hugo_vent') }}%
            icon: mdi:thermometer
            color: >-
              {% set current = state_attr('climate.ac_hugo',
              'current_temperature') | float(0) %} {% set target =
              state_attr('climate.ac_hugo', 'temperature') | float(0) %} {% if
              current > target + 1 %}red {% elif current < target - 1 %}blue {%
              else %}green{% endif %}
            features_position: bottom
            tap_action:
              action: more-info
            entity: climate.ac_hugo

          - type: custom:mushroom-template-card
            primary: Rumpus
            secondary: >-
              {{ state_attr('climate.ac_rumpus', 'current_temperature') }}°C
