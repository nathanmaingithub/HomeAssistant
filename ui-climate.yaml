              Vent {{ states('sensor.ac_rumpus_vent') }}%
            icon: mdi:thermometer
            color: >-
              {% set current = state_attr('climate.ac_rumpus',
              'current_temperature') | float(0) %} {% set target =
              state_attr('climate.ac_rumpus', 'temperature') | float(0) %} {%
              if current > target + 1 %}red {% elif current < target - 1 %}blue
              {% else %}green{% endif %}
            features_position: bottom
            tap_action:
              action: more-info
            entity: climate.ac_rumpus

